<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HR SmartHire AI — Login</title>
  <meta name="description" content="HR SmartHire AI — Secure admin login to the enterprise recruitment platform." />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-wrap {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      animation: fadeSlideUp 0.6s ease both;
    }
    .login-card {
      background: var(--bg-glass);
      backdrop-filter: blur(28px);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 44px 40px;
      box-shadow: var(--shadow-card), var(--shadow-glow);
    }
    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .login-logo-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      box-shadow: var(--shadow-btn);
    }
    .login-logo-text { font-size: 22px; font-weight: 800; color: var(--text-primary); }
    .login-logo-text span { color: var(--accent-3); }
    .login-heading {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .login-sub {
      text-align: center;
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }
    .input-with-icon {
      position: relative;
    }
    .input-with-icon .icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }
    .input-with-icon .form-control {
      padding-left: 42px;
    }
    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      transition: var(--transition);
      padding: 4px;
    }
    .toggle-pw:hover { color: var(--text-secondary); }
    .error-banner {
      background: var(--danger-bg);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 13px;
      color: var(--danger);
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .hint-box {
      background: rgba(99,102,241,0.08);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      text-align: center;
    }
    .hint-box strong { color: var(--accent-3); }
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }
    #btn-login {
      position: relative;
      overflow: hidden;
    }
    #btn-login .spinner {
      display: none;
      width: 18px; height: 18px;
    }
    #btn-login.loading .spinner { display: block; }
    #btn-login.loading .btn-text { display: none; }
  </style>
</head>
<body>
  <div class="bg-animated"></div>

  <div class="login-wrap">
    <div class="login-logo">
      <div class="login-logo-icon">🤖</div>
      <div class="login-logo-text">SmartHire <span>AI</span></div>
    </div>

    <div class="login-card">
      <h1 class="login-heading">Welcome Back</h1>
      <p class="login-sub">Sign in to your HR dashboard</p>

      <div class="hint-box">
        Use HR ID: <strong>admin</strong> &nbsp;|&nbsp; Password: <strong>admin</strong>
      </div>

      <div class="error-banner" id="error-banner">
        <span>⚠️</span>
        <span id="error-msg">Invalid credentials. Please try again.</span>
      </div>

      <form id="login-form" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="username">HR Admin ID</label>
          <div class="input-with-icon">
            <span class="icon">👤</span>
            <input id="username" class="form-control" type="text"
              placeholder="Enter your admin ID" autocomplete="off" value="admin" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-with-icon">
            <span class="icon">🔒</span>
            <input id="password" class="form-control" type="password"
              placeholder="Enter your password" autocomplete="current-password" value="admin" />
            <button type="button" class="toggle-pw" id="toggle-pw">👁️</button>
          </div>
        </div>
        <button id="btn-login" class="btn btn-primary btn-full btn-lg" type="submit">
          <div class="spinner"></div>
          <span class="btn-text">🚀 Sign In to Dashboard</span>
        </button>
      </form>
    </div>

    <div class="login-footer">
      &copy; 2026 HR SmartHire AI &mdash; Enterprise Recruitment Platform
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/auth.js"></script>
  <script>
    // Already logged in? redirect
    if (sessionStorage.getItem('hr_token')) {
      window.location.href = 'dashboard.html';
    }

    const form = document.getElementById('login-form');
    const btn  = document.getElementById('btn-login');
    const err  = document.getElementById('error-banner');
    const errMsg = document.getElementById('error-msg');
    const togglePw = document.getElementById('toggle-pw');
    const pwInput  = document.getElementById('password');

    togglePw.addEventListener('click', () => {
      const isText = pwInput.type === 'text';
      pwInput.type = isText ? 'password' : 'text';
      togglePw.textContent = isText ? '👁️' : '🙈';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.style.display = 'none';
      btn.classList.add('loading');
      btn.disabled = true;

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('http://localhost:8000/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (res.ok) {
          const data = await res.json();
          sessionStorage.setItem('hr_token', data.token);
          sessionStorage.setItem('hr_user', data.username);
          showToast('Login successful! Redirecting…', 'success');
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 900);
        } else {
          errMsg.textContent = 'Invalid HR ID or password. Please try again.';
          err.style.display = 'flex';
          btn.classList.remove('loading');
          btn.disabled = false;
        }
      } catch (ex) {
        errMsg.textContent = 'Cannot connect to server. Ensure backend is running on port 8000.';
        err.style.display = 'flex';
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
